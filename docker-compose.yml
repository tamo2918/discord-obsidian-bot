version: '3.8'

services:
  memo-bot:
    build: .
    container_name: discord-obsidian-bot
    restart: unless-stopped
    environment:
      # Required
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      # Channel configuration (at least one required)
      - CHANNEL_MEMO=${CHANNEL_MEMO:-}
      - CHANNEL_DIARY=${CHANNEL_DIARY:-}
      - CHANNEL_READING=${CHANNEL_READING:-}
      - CHANNEL_TODO=${CHANNEL_TODO:-}
      - CHANNEL_GLOSSARY=${CHANNEL_GLOSSARY:-}
      - CHANNEL_YOUTUBE=${CHANNEL_YOUTUBE:-}
      - DISCORD_CHANNELS=${DISCORD_CHANNELS:-}
      # Path configuration
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - GITHUB_PATH=${GITHUB_PATH:-Inbox}
      - GITHUB_PATH_MEMO=${GITHUB_PATH_MEMO:-Inbox}
      - GITHUB_PATH_DIARY=${GITHUB_PATH_DIARY:-Diary}
      - GITHUB_PATH_READING=${GITHUB_PATH_READING:-Reading}
      - GITHUB_PATH_TODO=${GITHUB_PATH_TODO:-Todo}
      - GITHUB_PATH_GLOSSARY=${GITHUB_PATH_GLOSSARY:-50_Glossary}
      - GITHUB_PATH_YOUTUBE=${GITHUB_PATH_YOUTUBE:-70_YouTube}
      # Processor
      - PROCESSOR_TIMEZONE=${PROCESSOR_TIMEZONE:-Asia/Tokyo}
      - PROCESSOR_TEMPLATE=${PROCESSOR_TEMPLATE:-daily}
      # AI formatting (optional)
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - AI_BASE_URL=${AI_BASE_URL:-http://localhost:11434}
      - AI_MODEL=${AI_MODEL:-gemma2}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_TIMEOUT=${AI_TIMEOUT:-60}
      # note.com RSS (optional)
      - NOTE_RSS_USERS=${NOTE_RSS_USERS:-}
      - NOTE_RSS_PATH=${NOTE_RSS_PATH:-70_Note}
      - NOTE_RSS_INTERVAL=${NOTE_RSS_INTERVAL:-60}
      - TZ=Asia/Tokyo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
